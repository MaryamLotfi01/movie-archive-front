<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/main.css" />
    <title>Document</title>
  </head>
  <body class="bg-black min-h-screen">
    <header>
      <nav class="flex justify-between h-20 border-b border-gray-600 py-4 px-2">
        <!-- left Side -->
        <div class="flex items-center gap-x-10 text-gray-400">
          <!-- logo -->
          <img src="../images/Logo.png" alt="" class="h-full" />
          <!-- links -->
          <div class="space-x-5 text-xl">
            <a href="#" class="hover:text-white">Home</a>
            <a href="#" class="hover:text-white">All Movies</a>
            <a href="#" class="hover:text-white">Categories</a>
          </div>
        </div>
        <!-- Right Side -->
        <div class="flex items-center gap-x-10">
          <!-- searchbox -->
          <input
            type="text"
            placeholder="Search Movie With Name"
            class="input input-bordered input-sm rounded-full w-64"
          />
          <!-- avatar -->
          <div class="h-full">
            <div class="dropdown dropdown-end h-full">
              <label tabindex="0" class="h-full">
                <div class="avatar h-full">
                  <div class="h-full rounded-full">
                    <img src="../images/Logo.png" class="h-full" />
                  </div>
                </div>
              </label>
              <ul
                tabindex="0"
                class="dropdown-content z-[1] menu p-2 shadow bg-base-100 rounded-box w-52"
              >
                <li><a>Item 1</a></li>
                <li><a>Item 2</a></li>
              </ul>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main></main>
    <footer></footer>
  </body>
</html>
