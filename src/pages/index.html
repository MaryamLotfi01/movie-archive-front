          <!-- logo -->
          <img src="../images/Logo.png" alt="" class="h-full" />

            <a href="#" class="desktop-navbar-link-item">Home</a>

          <input
            type="text"
            placeholder="Search Movie With Name"
            class="desktop-navbar-searchbox"
          />

          <div class="h-full">
            <div class="dropdown dropdown-end h-full">
              <label tabindex="0" class="h-full">
                <div class="avatar h-full">
                  <div class="h-full rounded-full">
                    <img src="../images/Logo.png" class="h-full" />

            </div>
          </div>
        </div>

                <li><a href="#">Categories</a></li>
              </ul>
